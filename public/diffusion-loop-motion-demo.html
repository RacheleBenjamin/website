<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solo to Social AI Diffusion Loop</title>
  <style>
    :root {
      --bg: #7f9584;
      --cream: #f2ecdf;
      --gold: #946b1d;
      --trace: rgba(242, 236, 223, 0.34);
      --worm: #d7c388;
      --worm-core: #f2ecdf;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
    }

    .canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 1200px;
      perspective-origin: center center;
    }

    .title {
      position: absolute;
      top: 28px;
      left: 112px;
      margin: 0;
      color: var(--cream);
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.02em;
      z-index: 2;
      max-width: 820px;
    }

    .label {
      position: absolute;
      color: var(--gold);
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 0.01em;
      z-index: 2;
    }

    .label-tight {
      position: absolute;
      color: var(--gold);
      font-size: 36px;
      font-weight: 500;
      letter-spacing: 0.01em;
      z-index: 2;
    }

    .loop-word {
      position: absolute;
      color: rgba(242, 236, 223, 0.9);
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -0.02em;
      z-index: 2;
      transform: translate(-50%, -50%);
      text-transform: lowercase;
      pointer-events: none;
    }

    .trace {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .trace-path {
      fill: none;
      stroke: var(--trace);
      stroke-width: 178;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mover {
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.12));
      z-index: 1;
    }

    .copilot-ribbon-left {
      fill: url(#copilot-left-gradient);
    }

    .copilot-ribbon-right {
      fill: url(#copilot-right-gradient);
    }

    .copilot-cut {
      fill: rgba(127, 149, 132, 0.9);
    }
  </style>
</head>
<body>
  <div class="scene" role="img" aria-label="Solo to Social AI Diffusion Loop">
    <svg class="trace" viewBox="0 0 2048 1152" aria-hidden="true">
      <defs>
        <linearGradient id="copilot-left-gradient" x1="-150" y1="-170" x2="80" y2="120" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#d8d8d8" />
          <stop offset="0.55" stop-color="#b6b6b6" />
          <stop offset="1" stop-color="#8a8a8a" />
        </linearGradient>
        <linearGradient id="copilot-right-gradient" x1="-20" y1="-40" x2="180" y2="180" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#cfcfcf" />
          <stop offset="0.55" stop-color="#ababab" />
          <stop offset="1" stop-color="#e0e0e0" />
        </linearGradient>
        <path
          id="loop-path"
          d="M 1024 576
             C 1024 346.25, 837.75 160, 608 160
             C 378.25 160, 192 346.25, 192 576
             C 192 805.75, 378.25 992, 608 992
             C 837.75 992, 1024 805.75, 1024 576
             C 1024 346.25, 1210.25 160, 1440 160
             C 1669.75 160, 1856 346.25, 1856 576
             C 1856 805.75, 1669.75 992, 1440 992
             C 1210.25 992, 1024 805.75, 1024 576 Z"
        />
      </defs>
      <path
        class="trace-path"
        d="M 1024 576
           C 1024 346.25, 837.75 160, 608 160
           C 378.25 160, 192 346.25, 192 576
           C 192 805.75, 378.25 992, 608 992
           C 837.75 992, 1024 805.75, 1024 576
           C 1024 346.25, 1210.25 160, 1440 160
           C 1669.75 160, 1856 346.25, 1856 576
           C 1856 805.75, 1669.75 992, 1440 992
           C 1210.25 992, 1024 805.75, 1024 576 Z"
      />

      <g class="mover">
        <g>
          <path
            class="copilot-ribbon-left"
            d="M -112 -28
               C -112 -86, -82 -132, -30 -146
               L 42 -166
               C 84 -178, 120 -154, 130 -112
               L 144 -52
               C 150 -26, 146 -2, 130 16
               L 72 78
               C 52 100, 30 110, 0 110
               L -58 110
               C -92 110, -112 86, -112 52 Z"
          />
          <path
            class="copilot-ribbon-right"
            d="M 4 28
               C 18 -24, 38 -64, 76 -82
               L 136 -110
               C 182 -132, 228 -102, 234 -52
               L 242 12
               C 248 62, 224 104, 188 126
               L 116 168
               C 78 190, 30 174, 12 134
               L -4 98
               C -14 74, -14 54, 4 28 Z"
          />
          <path
            class="copilot-cut"
            d="M 40 -18
               C 64 -40, 94 -46, 124 -40
               L 108 18
               C 102 42, 92 62, 70 80
               L 28 114
               C 8 86, 6 54, 18 20 Z"
          />
          <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
            <mpath href="#loop-path" />
          </animateMotion>
        </g>
      </g>
    </svg>

    <h1 class="title">Solo → Social AI Diffusion Loop</h1>

    <div class="loop-word" style="left: 608px; top: 576px;">social</div>
    <div class="loop-word" style="left: 1440px; top: 576px;">solo</div>

    <div class="label" style="left: 416px; top: 248px;">USE</div>
    <div class="label-tight" style="left: 252px; top: 458px;">CONSIDER</div>
    <div class="label" style="left: 436px; top: 760px;">PREPARE</div>
    <div class="label-tight" style="left: 920px; top: 458px;">SHARE</div>
    <div class="label" style="left: 1252px; top: 248px;">REACT</div>
    <div class="label-tight" style="left: 1486px; top: 458px;">INTERACT</div>
    <div class="label" style="left: 1150px; top: 760px;">COLLABORATE</div>
  </div>
</body>
</html>
